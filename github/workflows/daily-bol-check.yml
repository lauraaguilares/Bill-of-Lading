name: Chequeo diario de embarques (BOL automático)

on:
  schedule:
    # 13:00 UTC = 7:00 AM hora de Ciudad de México (CST, UTC-6). Ajustar si cambia el horario.
    - cron: '0 13 * * *'
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña "Actions" de GitHub, para pruebas

jobs:
  check-upcoming-loads:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint del cron
        run: |
          curl -sf "https://bill-of-lading.onrender.com/cron/check-upcoming-loads?secret=${{ secrets.CRON_SECRET }}" \
            || (echo "El chequeo diario falló" && exit 1)
