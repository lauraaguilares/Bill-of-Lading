name: Envío semanal de Weeklies (lunes)

on:
  schedule:
    # 13:00 UTC = 7:00 AM hora de Ciudad de México (CST, UTC-6), todos los lunes.
    - cron: '0 13 * * 1'
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña "Actions" de GitHub, para pruebas

jobs:
  send-weeklies:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint del cron
        run: |
          curl -sf "https://bill-of-lading.onrender.com/cron/send-weeklies?secret=${{ secrets.CRON_SECRET }}" \
            || (echo "El envío semanal de weeklies falló" && exit 1)
